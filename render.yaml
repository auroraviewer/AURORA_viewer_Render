# Render Blueprint: deploys the AURORA viewer from space/.
#
# Connect this GitHub repo to Render and it reads this file automatically
# (Render "Blueprint" deploy).  The app is CPU-only and streams predictions and
# the H&E straight from the Hugging Face dataset, so it needs no GPU and no
# bundled data.
services:
  - type: web
    name: aurora-viewer
    runtime: docker
    rootDir: space
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AURORA_BACKEND
        value: hf
      - key: AURORA_HF_REPO
        value: AURORAData/AURORA_prediction
      # the LUAD predictions live in two folders, so the list is comma-separated
      - key: AURORA_HF_SUBFOLDER
        value: TCGA_LUAD_website,predictions_7um_28um/TCGA_LUAD
      - key: AURORA_HE_REPO
        value: AURORAData/AURORA_prediction
      - key: AURORA_HE_SUBFOLDER
        value: HE_image_website
      - key: AURORA_DEFAULT_SAMPLE
        value: TCGA-44-5645-01B-04-BS4
      # Prefetch downloads each sample once so views after the first are fast.
      # On the free tier the disk is ephemeral and wiped on sleep, so this
      # re-downloads the sample after each wake.  If you hit disk-full errors,
      # set this to 0 (stream from HF instead; the first gene is then slower).
      - key: AURORA_PREFETCH
        value: "1"
