<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>H&E + Gene Expression Viewer</title>

    <style>
    body {
      margin: 0;
      background: #000;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #root {
      flex: 1;
      min-height: 0; /* critical for OpenSeadragon */
    }

    #viewer1,
    #viewer2,
    #viewer3 {
      width: 100%;
      height: 100%;
    }

      .control-button {
        padding: 6px 14px;
        background: #222;
        color: white;
        border: 1px solid #555;
        cursor: pointer;
        border-radius: 4px;
      }

      .control-button:hover {
        background: #333;
      }
    </style>
    <script type="module" crossorigin src="/AURORA_viewer/assets/index-BJ5GV_ia.js"></script>
  </head>

  <body>
    <!-- HEADER -->
    <header
      style="
        width: 100%;
        background: #111;
        color: white;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-sizing: border-box;
      "
    >
      <img src="/AURORA_viewer/logo.png" alt="Logo" style="height: 50px; width: 76px;" />
      <h1
        style="
          margin: 0;
          font-size: 28px;
          font-weight: 600;
          width: 100%;
          text-align: center;
        "
      >
        H&E and Gene Expression Viewer
      </h1>
    </header>
  <style>
  a {
    color: #B7BDF7;        /* normal link color */
    /*text-decoration: none; /* remove underline if you want */
  }

  a:visited {
    color: #B7BDF7;    /* after link is clicked */
  }

  a:hover {
    color: #B7BDF7;       /* when you hover over the link */
  }

  a:active {
    color: #B7BDF7;          /* when you click the link */
  }
  </style>
    <a href="https://github.com/auroraviewer/AURORA_viewer/tree/gh-pages?tab=readme-ov-file#aurora-he--gene-expression-viewer" target="_blank" rel="noopener noreferrer" style="font-size: 15px;">
    Click here to see the tutorial
    </a>

    <!-- CONTROLS -->
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 10px 16px;
        border-bottom: 1px solid #444;
        gap: 20px;
        flex-wrap: wrap;
        color: white;
      "
    >
      <!-- H&E -->
      <div>
        <b>Load H&E Image</b>
        <div style="margin-top: 6px;">
          <input
            id="fileImage"
            type="file"
            accept=".png,.jpg,.jpeg"
            style="display: none"
          />
          <button
            class="control-button"
            onclick="document.getElementById('fileImage').click()"
          >
            Select H&E Image
          </button>
        </div>
      </div>

      <!-- Patch predictions -->
      <div>
        <b>Load Patch Predictions</b>
        <div style="margin-top: 6px;">
          <input
            id="filePatchPredictions"
            type="file"
            accept=".png,.jpg,.jpeg"
            multiple
            style="display: none"
          />
          <button
            class="control-button"
            onclick="document.getElementById('filePatchPredictions').click()"
          >
            Select Patch Prediction Images
          </button>
        </div>
      </div>

      <!-- iStar predictions -->
      <div>
        <b>Load iStar Predictions</b>
        <div style="margin-top: 6px;">
          <input
            id="fileiStarPredictions"
            type="file"
            accept=".png,.jpg,.jpeg"
            multiple
            style="display: none"
          />
          <button
            class="control-button"
            onclick="document.getElementById('fileiStarPredictions').click()"
          >
            Select iStar Prediction Images
          </button>
        </div>
      </div>
    </div>

    <!-- React mount -->
    <div id="root"></div>

    <!-- React entry -->
  </body>
</html>
